name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Install Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Create proguard-rules.pro
        run: |
          cat > app/proguard-rules.pro << 'PGEOF'
          -keep class com.rx.pocketvps.** { *; }
          -keepattributes *Annotation*
          -dontwarn okhttp3.**
          PGEOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias pocketvps \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=PocketVPS,OU=R4X,O=R4XGAMEZ,L=IN,ST=IN,C=IN" \
            -storepass roshan123 \
            -keypass roshan123

      - name: Find apksigner
        run: find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -r | head -5

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -r | head -1)
          echo "Using: $APKSIGNER"
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias pocketvps \
            --ks-pass pass:roshan123 \
            --key-pass pass:roshan123 \
            --out PocketVPS-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Signed!"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketVPS-signed
          path: PocketVPS-signed.apk
          retention-days: 14
