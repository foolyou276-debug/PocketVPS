plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rx.pocketvps'
    compileSdk 34

    defaultConfig {
        applicationId "com.rx.pocketvps"
        minSdk 21          // Android 5.0+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true         // Code shrink karo
            shrinkResources true       // Resources shrink
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // No extra dependencies - pure Android!
}
